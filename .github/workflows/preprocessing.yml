name: Automated Data Preprocessing Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "preprocessing/automate_*.py"
      - "**.csv"
  workflow_dispatch:
    inputs:
      dataset_url:
        description:
          "Dataset URL (optional, uses default if
          empty)"
        required: false
        type: string
  schedule:
    - cron: "0 0 * * *"

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests

      - name: Verify dataset URL accessibility
        run: |
          python -c "
          import requests
          url = 'https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.csv'
          response = requests.head(url, timeout=10)
          assert response.status_code == 200, f'Dataset tidak dapat diakses: {response.status_code}'
          print('Dataset URL valid dan dapat diakses.')
          "

      - name: Run preprocessing pipeline
        run: |
          python preprocessing/automate_Pasha_Rdp.py
        env:
          PYTHONUNBUFFERED: 1

      - name: List preprocessed files
        run: |
          echo "=== Preprocessed Data Files ==="
          ls -la preprocessed_data/
          echo "================================"

      - name: Upload preprocessed data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-dataset
          path: preprocessed_data/
          retention-days: 7

      - name:
          Commit and push preprocessed data (if
          changes)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add preprocessed_data/
          git diff --cached --quiet || git commit -m "Automated preprocessing: update dataset [skip ci]"
          git push
        continue-on-error: true
