name: MLflow Retraining CI

on:
  push:
    branches: [main, master]
    paths:
      - "MLProject/**"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  WORKING_DIR: "MLProject"

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version:
            ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn

      - name: Force Local MLflow Tracking
        run: |
          echo "MLFLOW_TRACKING_URI=file:./mlruns" >> $GITHUB_ENV
          echo "Using LOCAL MLflow tracking in CI"

      - name: Run Model Training
        run: |
          cd ${{ env.WORKING_DIR }}
          export MLFLOW_TRACKING_URI=file:./mlruns
          python modelling.py --model_name all

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: ${{ env.WORKING_DIR }}/mlruns/

      - name: Create Summary
        run: |
          echo "## MLflow Training Complete" >> $GITHUB_STEP_SUMMARY
          echo "Training artifacts available in artifacts" >> $GITHUB_STEP_SUMMARY
